<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="/js/guard/obf/trc.js"></script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js" crossorigin="anonymous"></script>

    <script src="sharedio/sharedio.js"></script>
    <script src="socketioclient.js?v=10"></script>

    <link rel="stylesheet" href="/css/text-effects.css">
    <script src="/js/text-effects.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            overflow-x: hidden;
        }

        #chatContainer {
            width: 100%;
            height: calc(100vh - 25px);
            overflow-y: hidden;
            overflow-wrap: break-word;
            word-break: break-all;
            overflow-x: hidden;
        }

        @keyframes chatMessageOpacityIntro {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes chatMessageSlideIntro {
            0% {
                left: 100px;
            }

            100% {
                left: 0px;
            }
        }

        .chatMessage {
            position: relative;
            margin-top: 4px;
            overflow-wrap: break-word;
            word-break: break-all;
            max-width: 100%;
            width: 100%;
            overflow-x: hidden;
            padding-top: 3px;
            padding-left: 4px;
            padding-right: 10px;
            border-radius: 10px;
        }

        .comment {
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
            overflow-x: hidden;
            margin-bottom: 5px;
        }

        .username {
            font-weight: bold;
            margin-bottom: 2px;
        }

        img {
            margin-right: 5px;
            border-radius: 15%;
            height: 50px;
            width: 50px;
        }

        td {
            vertical-align: top;
        }

        .fadeOut {
            animation-name: smoothFadeout;
            animation-duration: 1s;
            animation-fill-mode: forwards;
        }

        @keyframes smoothFadeout {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        @keyframes redBlinkAnimation {
            0% {
                background-color: transparent;
            }

            25% {
                background-color: rgba(211, 65, 60, 0.56);
            }

            50% {
                background-color: rgba(211, 65, 60, 0.56);
            }

            100% {
                background-color: transparent;
            }
        }

        @keyframes redGlowAnimation {
            0% {
                background-color: transparent;
            }

            10% {
                background-color: rgba(211, 65, 60, 0.56);
            }

            100% {
                background-color: transparent;
            }
        }

        .slideIn {
            animation-name: chatMessageOpacityIntro, chatMessageSlideIntro;
            animation-duration: 0.5s, 0.5s;
            animation-iteration-count: 1, 1;
        }

        @keyframes foundAnimation {
            0% {
                background-color: transparent;
            }

            25% {
                background-color: rgba(70, 203, 52, 0.56);
            }

            50% {
                background-color: rgba(70, 203, 52, 0.56);
            }

            100% {
                background-color: transparent;
            }
        }

        @keyframes foundAnimationEnd {
            0% {
                background-color: transparent;
            }

            100% {
                background-color: rgba(70, 203, 52, 0.56);
            }
        }

        .found {
            animation-name: foundAnimation, foundAnimationEnd, chatMessageOpacityIntro, chatMessageSlideIntro;
            animation-duration: 0.5s, 0.3s, 0.5s, 0.5s;
            animation-iteration-count: 3, 1, 1, 1;
            animation-delay: 0s, 1.5s, 0s, 0s;
            animation-fill-mode: none, forwards, none, none;
        }
    </style>

    <script>

        var nothumb = "/img/nothumb.webp";

        function rndColorPart(min, max) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        $(window).on("load", () => {

            var chatContainer = $("#chatContainer");
            var template = $(".chatMessage").first().clone();
            template.css("display", "block");

            var userIdColorMappings = {};

            $(".chatMessage").remove();

            io.on("chat", (message) => {
                //clear
                if ($(".chatMessage").length > 100) {
                    $(".chatMessage").slice(0, 50).remove();
                }

                var thisItem = template.clone();

                thisItem.find("img").attr("src", message.profilePictureUrl || nothumb)
                thisItem.find(".username").text(message.nickname || message.uniqueId);
                thisItem.find(".comment").text(message.comment);
                thisItem.attr("data-ts", new Date().getTime());

                if (!message.isSubscriber && !message.isModerator && settings.chat_showChatNormal === false) {
                    return;
                }

                if (message.isSubscriber && settings.chat_showChatSub === false) {
                    return;
                }

                if (message.isModerator && settings.chat_showChatMod === false) {
                    return;
                }

                if (message.isModerator) {
                    thisItem.find(".username").css('color', settings.chat_usernameColorMod);
                    thisItem.find(".comment").css('color', settings.chat_commentColorMod);
                    thisItem.css('background-color', settings.chat_backgroundMod);
                } else if (message.isSubscriber) {
                    thisItem.find(".username").css('color', settings.chat_usernameColorSub);
                    thisItem.find(".comment").css('color', settings.chat_commentColorSub);
                    thisItem.css('background-color', settings.chat_backgroundSub);
                } else {
                    thisItem.find(".username").css('color', settings.chat_usernameColorNormal);
                    thisItem.find(".comment").css('color', settings.chat_commentColorNormal);
                    thisItem.css('background-color', settings.chat_backgroundNormal);
                }


                if (settings.chat_showPictures === false) {
                    thisItem.find("img").css('display', 'none');
                }

                if (settings.chat_mini) {
                    thisItem.find("img").css('height', "25px");
                    thisItem.find("img").css('width', "25px");
                    thisItem.find("img").css('margin-bottom', "-5px");
                    thisItem.find(".username").text(thisItem.find(".username").text() + ":")
                    thisItem.find(".username").css("display", "inline");
                    thisItem.find(".comment").css("display", "inline");
                    thisItem.css("padding-bottom", "5px");
                }

                if (settings.chat_usernameRgb) {
                    if (!userIdColorMappings[message.userId]) {
                        userIdColorMappings[message.userId] = "rgba(" + rndColorPart(100, 240) + "," + rndColorPart(100, 240) + "," + rndColorPart(100, 240) + ", 1)";
                    }

                    thisItem.find(".username").css('color', userIdColorMappings[message.userId]);
                }

                if (window.TextEffects) {
                    let usernameEffect = 'none';
                    let waveEnabled = false;
                    let waveSpeed = 'normal';
                    let glowEnabled = false;
                    let glowColor = '#ffffff';

                    if (message.isModerator) {
                        usernameEffect = settings.chat_usernameEffectMod || 'none';
                        waveEnabled = settings.chat_usernameWaveMod === 'true' || settings.chat_usernameWaveMod === true;
                        waveSpeed = settings.chat_usernameWaveSpeedMod || 'normal';
                        glowEnabled = settings.chat_usernameGlowMod === 'true' || settings.chat_usernameGlowMod === true;
                        glowColor = settings.chat_usernameGlowColorMod || '#d93030';
                    } else if (message.isSubscriber) {
                        usernameEffect = settings.chat_usernameEffectSub || 'none';
                        waveEnabled = settings.chat_usernameWaveSub === 'true' || settings.chat_usernameWaveSub === true;
                        waveSpeed = settings.chat_usernameWaveSpeedSub || 'normal';
                        glowEnabled = settings.chat_usernameGlowSub === 'true' || settings.chat_usernameGlowSub === true;
                        glowColor = settings.chat_usernameGlowColorSub || '#e8b461';
                    } else {
                        usernameEffect = settings.chat_usernameEffectNormal || 'none';
                        waveEnabled = settings.chat_usernameWaveNormal === 'true' || settings.chat_usernameWaveNormal === true;
                        waveSpeed = settings.chat_usernameWaveSpeedNormal || 'normal';
                        glowEnabled = settings.chat_usernameGlowNormal === 'true' || settings.chat_usernameGlowNormal === true;
                        glowColor = settings.chat_usernameGlowColorNormal || '#ffffff';
                    }

                    const $username = thisItem.find(".username");
                    TextEffects.applyComprehensiveEffects($username, {
                        effect: usernameEffect,
                        wave: waveEnabled,
                        waveSpeed: waveSpeed,
                        glow: glowEnabled,
                        glowColor: glowColor,
                        isRgbColor: settings.chat_usernameRgb,
                        rgbColor: userIdColorMappings[message.userId],
                        defaultColor: message.isModerator ? settings.chat_usernameColorMod :
                                     message.isSubscriber ? settings.chat_usernameColorSub :
                                     settings.chat_usernameColorNormal
                    });
                }


                if (settings.chat_autoWidth) {
                    thisItem.css("width", "fit-content");
                }

                if (settings.chat_rightAlignment) {
                    thisItem.css("float", "right");
                    thisItem.css("clear", "right");
                }

                if (settings.chat_slideEffect !== false) {
                    thisItem.addClass('slideIn');
                }

                chatContainer.append(thisItem);

                chatContainer.stop().animate({ scrollTop: chatContainer.prop("scrollHeight") }, 600);
            })
        });

        setInterval(() => {
            if (settings && settings.chat_hideAfter && settings.chat_hideAfter > 0) {
                $(".chatMessage").each((i, elem) => {
                    let elemTs = elem.getAttribute("data-ts");
                    if (elemTs) {
                        if (elemTs < (new Date().getTime() - (settings.chat_hideAfter * 1000))) {
                            $(elem).removeAttr("data-ts").removeClass("slideIn").addClass("fadeOut");
                        }
                    }
                })
            }
        }, 100)

</head>

<body>
    <div id="chatContainer">
        <div class="chatMessage" style="display: none;">
            <table>
                <tr>
                    <td>
                        <img onerror="this.src=nothumb" />
                    </td>
                    <td>
                        <div class="username"></div>
                        <div class="comment"></div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>
