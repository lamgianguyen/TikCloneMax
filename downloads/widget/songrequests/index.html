<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="/js/guard/obf/trc.js"></script>

    <script src="/js/lib/jquery.min.js" crossorigin="anonymous"></script>
    <script src="/js/lib/socket.io.min.js" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/@lottiefiles/lottie-player@1.6.3/dist/lottie-player.js"></script>

    <script src="sharedio/sharedio.js"></script>
    <script src="socketioclient.js?v=10"></script>

    <link rel="stylesheet" href="/css/text-effects.css">
    <script src="/js/text-effects.js"></script>
    <script src="/js/text-effects-integration.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        #playlistContainer {
            width: 100%;
            height: calc(100vh - 25px);
            overflow-wrap: break-word;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        .playlistItem {
            margin-top: 3px;
            margin-bottom: 3px;
            overflow-wrap: break-word;
            max-width: 100%;
            overflow-x: hidden;
            border-radius: 5px;
        }

        .songText {
            overflow-wrap: break-word;
            word-break: break-all;
            max-width: 100%;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        .requestBy {
            overflow-wrap: break-word;
            word-break: break-all;
            max-width: 100%;
            overflow-x: hidden;
            /* margin-top: 3px; */
            margin-bottom: 2px;
        }

        .songName {
            font-weight: bold;
        }

        .songCoverImg {
            margin-right: 12px;
            margin-left: 12px;
            border-radius: 5px;
        }

        td {
            vertical-align: top;
        }

        .songCoverImg {
            height: 70px;
            width: 70px;
        }

        .isCurrent {
            font-size: 1.1em;
        }

        .isCurrent .songCoverImg {
            height: 80px;
            width: 80px;
        }

        .marginTop {
            margin-top: 10px;
        }

        .requestByImg {
            height: 10px;
            width: 10px;

            height: 16px;
            width: 16px;
            margin: 0px;
            margin-bottom: -3px;
            border-radius: 50%;
        }

        .isCurrent .requestByImg {
            height: 18px;
            width: 18px;
        }
    </style>
</head>

<body>
    <pre id="error"></pre>

    <div id="playlistContainer">
        <div class="playlistItem" style="display: none;">
            <table>
                <tr>
                    <td style="vertical-align: middle;">
                        <img class="songCoverImg" onerror="this.src=nocover" />
                    </td>
                    <td style="vertical-align: middle;">
                        <div class="songName">Testuser</div>
                        <div class="requestBy">by <img class="requestByImg" onerror="this.src=nothumb"></img>
                            <span>Username</span>
                        </div>
                        <div class="songText">Bla usdfghdf djfghhdfhg dfHGs bHHAHHAH sdfhsdfshdfgsd hdhhdshfhshdf dh
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <script>

        var nothumb = "/img/nothumb.webp";
        var nocover = "img/spotifynothumb.png";
        let previewEnabled = true;

        function updateSettings(hasChanges) {
            if (!settings) return;

            $("body").css("color", settings.songrequests_fontColor);
            $(".songName").css("color", settings.songrequests_titleColor);

            if (settings.songrequests_showBoxShadow) {
                $(".playlistItem").css("background-color", settings.songrequests_boxShadowColor);
            } else {
                $(".playlistItem").css("background-color", "transparent");
            }
        }

        var hideTimeout = null;

        function show() {
            $("body").fadeIn(200);

            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }

            hideTimeout = setTimeout(() => {
                $("body").fadeOut(500);
            }, 8000)
        }

        function formatNicely(text) {
            if (!text) return "";
            text = text.replace(/ *\([^)]*\) */g, " ");
            text = text.replace(/ *\[[^)]*\] */g, " ");
            return text.trim();
        }

        function millisToMinutesAndSeconds(millis) {
            var minutes = Math.floor(millis / 60000);
            var seconds = ((millis % 60000) / 1000).toFixed(0);
            return minutes + ":" + (seconds < 10 ? '0' : '') + seconds;
        }

        $("#error").hide();


        var playlistContainer = $("#playlistContainer");
        var template = $(".playlistItem").first().clone();
        template.css("display", "block");

        $(".playlistItem").remove();

        var lastLen = 0;
        var lastSongId = "";

        io.on("setPlaylistItems", (items) => {
            if (!items[0]?.isPreview) {
                previewEnabled = false;
            }

            if (items.length > 0) {
                if (typeof items[0].display === "boolean") {
                    if (items[0].display) show();
                } else {
                    show();
                }

                if (lastSongId !== items[0].songId) {
                    lastSongId = items[0].songId;
                    show();
                }
            }

            if (items.length !== lastLen) {
                lastLen = items.length;
                show();
            }

            //clear
            $(".playlistItem").remove();

            var timeToPlay = 0;

            items.forEach(song => {
                var thisItem = template.clone();

                if (song.songThumbnail) {
                    thisItem.find("img").attr("src", song.songThumbnail);
                } else {
                    thisItem.find("img").attr("src", nocover);
                }

                const songTitle = formatNicely(song.songName);
                const songArtist = formatNicely(song.songArtist);
                thisItem.find(".songName").text(songArtist ? `${songTitle} - ${songArtist}` : songTitle);

                if (song.user) {
                    thisItem.find(".requestBy span").text(song.user.username);
                    thisItem.find(".requestBy .requestByImg").attr("src", song.user.profilePictureUrl)
                } else {
                    thisItem.find(".requestBy").hide();
                    thisItem.find(".songText").addClass("marginTop");
                }

                if (window.TextEffectsIntegration) {
                    TextEffectsIntegration.applyTitleEffects('songrequests', thisItem.find('.songName'), settings);
                    if (song.user) {
                        TextEffectsIntegration.applyUsernameEffects('songrequests', thisItem.find('.requestBy span'), settings);
                    }
                }

                if (song.isCurrent) {
                    thisItem.addClass("isCurrent");
                    thisItem.find(".songText").text(millisToMinutesAndSeconds(song.songPosition) + " / " + millisToMinutesAndSeconds(song.songDuration));
                    timeToPlay = song.songDuration - song.songPosition;
                } else {
                    thisItem.find(".songText").text("Start in " + millisToMinutesAndSeconds(timeToPlay));
                    timeToPlay += song.songDuration;
                }

                if (settings && settings.songrequests_showBoxShadow) thisItem.css("background-color", settings.songrequests_boxShadowColor);
                if (settings) thisItem.find(".songName").css("color", settings.songrequests_titleColor);

                let rtl = settings.songrequests_rightToLeft;

                thisItem.find('.songText').css('direction', rtl ? 'ltr' : 'initial');
                thisItem.find('.songText').css('text-align', rtl ? 'right' : 'initial');
                thisItem.find('.songName').css('direction', rtl ? 'ltr' : 'initial');
                thisItem.find('.songName').css('text-align', rtl ? 'right' : 'initial');
                thisItem.find('.requestBy').css('direction', rtl ? 'ltr' : 'initial');
                thisItem.find('.requestBy').css('text-align', rtl ? 'right' : 'initial');

                playlistContainer.append(thisItem);
            });
        });

        $(document).ready(updateSettings);

        $("body").hide();

        function preview() {
            if (!previewEnabled) return;

            io.fakeEmit('setPlaylistItems', [
                {
                    "songThumbnail": "https://i.scdn.co/image/ab67616d0000b273255191ed87a907d362b43f19",
                    "songId": "5UEnHoDYpsxlfzWLZIc7LD",
                    "songName": "River (feat. Ed Sheeran)",
                    "songArtist": "Eminem",
                    "isCurrent": true,
                    "songPosition": 65708,
                    "songDuration": 221013,
                    "isPreview": true,
                },
                {
                    "songThumbnail": "https://i.scdn.co/image/ab67616d0000b27346e1307c35579c3483ea7b03",
                    "songId": "2r6OAV3WsYtXuXjvJ1lIDi",
                    "songName": "Hello (feat. A Boogie Wit da Hoodie)",
                    "songArtist": "Pop Smoke",
                    "isCurrent": false,
                    "songDuration": 190534,
                },
                {
                    "songThumbnail": "https://i.scdn.co/image/ab67616d0000b27318a4e368b051bdb047c02330",
                    "songId": "72AbCBCbe5cYOLQy2nZdWA",
                    "songName": "Bye Bye Bye",
                    "songArtist": "Younotus",
                    "isCurrent": false,
                    "songDuration": 161330,
                }
            ])
        }

    </script>
</body>

</html>
