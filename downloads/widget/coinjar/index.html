<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- TikMax widget hardening (wf_806eb47d): img→proxy shim · addGift pre-mount queue · promise-noise guard. MUST run before coin-jar.js. -->
    <script>
      (function () {
        if (window.__tikmaxCoinjarShim) return;
        window.__tikmaxCoinjarShim = true;
        // FIX-B: route *.tiktokcdn.com images through the local proxy → a valid
        // (transparent) PNG instead of a broken texture. Covers coin-jar's
        // off-DOM new Image() textures + standalone/OBS (no Electron intercept).
        var CDN = /^[a-z0-9-]+\.tiktokcdn\.com$/i; // ONLY tiktokcdn; leave assets.tikfinity.com/local/data/blob alone
        function rewrite(v) {
          if (typeof v !== "string") return v;
          if (v.indexOf("/tiktok-img-cache/") !== -1) return v;
          if (v.lastIndexOf("data:", 0) === 0 || v.lastIndexOf("blob:", 0) === 0) return v;
          try { var u = new URL(v, location.href); if (CDN.test(u.hostname)) return "/tiktok-img-cache/" + u.hostname + u.pathname + u.search; } catch (e) {}
          return v;
        }
        var dsc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
        if (dsc && dsc.set) {
          Object.defineProperty(HTMLImageElement.prototype, "src", {
            get: dsc.get, set: function (v) { dsc.set.call(this, rewrite(v)); },
            configurable: true, enumerable: dsc.enumerable,
          });
        }
        // FIX-C: queue gifts that arrive before coin-jar.js (Vue setup) assigns
        // the real window.addGift (unconditional assignment → overwrites this stub);
        // the load handler drains the queue right after mount.
        window.__giftQueue = window.__giftQueue || [];
        if (typeof window.addGift !== "function") {
          window.addGift = function (d) { window.__giftQueue.push(d); };
        }
        // FIX-D′: mute image-promise rejection noise ONLY (real Error rejections still surface).
        window.addEventListener("unhandledrejection", function (e) {
          if (e.reason instanceof Event) e.preventDefault();
        });
      })();
    </script>

    <script
      type="module"
      crossorigin
      src="/vue/dist/widgets/coin-jar/coin-jar.js"
    ></script>
  </head>
  <body>
    <div id="app"></div>

    <script>
      window.addEventListener("load", () => {
        const CoinJar = window.createCoinJar();
        CoinJar.mount("#app");
        // Drain gifts queued before mount — window.addGift is now the real one.
        try {
          (window.__giftQueue || []).splice(0).forEach((d) => { try { window.addGift(d); } catch (e) {} });
        } catch (e) {}
      });

      let triggered = false;

      io.on("coin-jar:gift", (data) => {
        // null-safe + all-pro: only skip when settings EXPLICITLY says not-pro.
        // null/undefined settings (cold tab, before first widgetSettings) → allow.
        if(!location.href.includes('preview=1') && settings && settings.isPro === false) {
          return;
        }

        triggered = true;
        window.addGift(data);
      });

      io.on("coin-jar:reset", () => {
        // [INSTR-2026-06-04] coinjar-reset-diag — find where reset dies at runtime
        console.log('%c[CoinJar DIR] RESET received', 'color:#ff9800;font-weight:bold', '| resetJar defined=', !!window.resetJar);
        if (!window.resetJar) { console.error('[CoinJar DIR] window.resetJar UNDEFINED — Vue not mounted?'); return; }
        window.resetJar();
      });

      function preview() {
        if (triggered) return;
        triggered = true;

        setTimeout(() => {
          window.addGift({
            giftPictureUrl:
              "https://p19-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.png",
            value: 1,
            repeatCount: 10,
            giftName: "Rose",
            username: "Test User 1",
            profilePictureUrl:
              "https://p16-useast2a.tiktokcdn.com/tos-useast2a-avt-0068-giso/4ec174248f94de26938f73874962469b~c5_100x100.jpeg",
          });
        }, 3_000);

        setTimeout(() => {
          window.addGift({
            giftPictureUrl:
              "https://p19-webcast.tiktokcdn.com/img/maliva/webcast-va/6cd022271dc4669d182cad856384870f~tplv-obj.png",
            value: 100,
            repeatCount: 2,
            giftName: "Hand Hearts",
            username: "Test User 2",
            profilePictureUrl:
              "https://p16-useast2a.tiktokcdn.com/tos-useast2a-avt-0068-giso/4ec174248f94de26938f73874962469b~c5_100x100.jpeg",
          });
        }, 13_000);

        setTimeout(() => {
          window.addGift({
            giftPictureUrl:
              "https://p19-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.png",
            value: 1,
            repeatCount: 10,
            giftName: "Rose",
            username: "Test User 3",
            profilePictureUrl:
              "https://p16-useast2a.tiktokcdn.com/tos-useast2a-avt-0068-giso/4ec174248f94de26938f73874962469b~c5_100x100.jpeg",
          });
        }, 20_000);
      }
    </script>
  </body>
</html>
