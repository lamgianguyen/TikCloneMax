    <script>
class SharedIO {
    constructor() {
        this.worker = new SharedWorker('/widget/sharedio/sharedioworker.js');
        this.worker.port.start();
        this.eventListener = [];
        this.connectTimeout = null;

        this.worker.port.onmessage = (e) => {
            let data = e.data;

            switch (data.name) {
                case "connectCallback":
                    if (this.connectTimeout) {
                        clearTimeout(this.connectTimeout);
                    }
                    break;
                case "ioEvent":
                    this.eventListener.filter(x => x.eventName === data.params.eventName).forEach(listener => {
                        listener.listenerFn.apply(this, data.params.eventData)
                    })
                    break;
            }
        }

        window.addEventListener('beforeunload', () => {
            this.sendWorkerCommand("disconnect");
        })
    }

    sendWorkerCommand(commandName, commandParams = {}) {
        this.worker.port.postMessage({
            name: commandName,
            params: commandParams
        });
    }

    connect(channelId, onTimeout) {
        this.connectTimeout = setTimeout(() => {
            console.warn("[SharedIO] connect timeout!");
            if (typeof onTimeout === "function") {
                onTimeout();
            }
        }, 10000);
        
        this.sendWorkerCommand("connect", { channelId });
    }

    on(eventName, listenerFn) {
        this.eventListener.push({ eventName, listenerFn });
        this.sendWorkerCommand("attachEvent", { eventName });
    }

    emit(eventName, eventData) {
        this.sendWorkerCommand("emit", { eventName, eventData });
    }
}

    <script>
// Cookies
try {
    // set cookie for .zerody.one
    if (location.host.includes('.zerody.one')) document.cookie = "zerody=doesntlikecookies; domain=.zerody.one; path=/; expires=Fri, 31 Dec 9999 23:59:59 GMT";
} catch (err) { }


// ======= Error Logging ===========
window.onerror = function (message, file, line, column, errorObj) {
    try {
        logError({ message, file, line, column, stack: (errorObj ? errorObj.stack : null) });
    } catch (err) {
        logError({ message: "error while logging" });
    }
}

let loggedErrors = [];

function logError(obj) {
    if (loggedErrors.length > 100 || loggedErrors.includes(JSON.stringify(obj))) {
        return;
    }

    loggedErrors.push(JSON.stringify(obj));

    obj.type = "Widget Error";
    obj.channelId = channelId;
    obj.screenId = screenId;
    obj.path = location.pathname;

    $.ajax({
        type: "POST",
        timeout: 5000,
        url: "/api/logError?origin=widget",
        contentType: "application/json; charset=utf-8",
        dataType: "json",
        data: JSON.stringify(obj)
    });
}
// ==================================


var channelId = 0;
var screenId = 1;
var settings = JSON.parse(localStorage.getItem("cachedSettings") || "{}");
var widgetId = document.location.pathname.split("/")[2];
var lastFontType = null;

var urlParams = new URLSearchParams(location.search);

channelId = urlParams.get("cid") ? parseInt(urlParams.get("cid")) : 0;
screenId = urlParams.get("screen") ? parseInt(urlParams.get("screen")) : 1;


if (typeof SharedIO === "function" && typeof SharedWorker === "function" && urlParams.get("disableSharedIO") !== "1") {

    try {
        window.io = new SharedIO();

        if (window.location.href.includes('preview=1') && widgetId === "activity-feed") {
            // do not use sharedIO in preview mode for activity feed
            // Because the activity-feed iframe is always loaded
        } else {
            window.io.connect(channelId, () => {
                logError({ component: "WidgetIO", message: "SharedIO timeout" });
            });
        }
    } catch (err) {
        logError({ component: "WidgetIO", message: "SharedIO exception", err: err.toString(), stack: (err ? err.stack : null) });
    }

} else {

    logError({ component: "WidgetIO", message: "SharedIO not supported", sharedWorkerSupported: typeof SharedWorker === "function" });

    let ioConfig = {
        transports: ["websocket"],
        upgrade: false,
        query: {
            appType: "widget",
            shared: false
        }
    };

    if (urlParams.get('ioHost')) {
        window.io = new io(urlParams.get('ioHost'), ioConfig);
    } else {
        window.io = new io(ioConfig);
    }

    function login() {
        io.emit("login", {
            channelId,
            appType: "widget",
            receiveChat: window.location.href.includes('chat') || window.location.href.includes('emoji') || window.location.href.includes('streambuddies'),
            receiveGift: window.location.href.includes('gift') || window.location.href.includes('firework') || window.location.href.includes('cannon'),
        })
    }

    io.on("connect", login);
    io.on("reconnect", login);
}


function reportState(stateData) {
    if (channelId === 0) return;
    io.emit("reportWidgetState", {
        widgetId,
        screenId,
        state: stateData,
        isHidden: document.hidden,
        isPreview: location.href.includes('preview=1')
    });
}

io.on("widgetSettings", function (data) {
    if (location.href.includes('preview=1') && (data == null) && localStorage.getItem("cachedSettings")) {
        data = JSON.parse(localStorage.getItem("cachedSettings") || "{}");
    }

    reportState({ event: "widgetSettingsAck" });
    var hasChanges = JSON.stringify(settings) !== JSON.stringify(data);
    localStorage.setItem("cachedSettings", JSON.stringify(data));
    settings = data;
    if (typeof updateSettings === "function") updateSettings(hasChanges);
    setFontSettings();
})

setInterval(() => {
    reportState({ event: "alive" });
}, 120 * 1000)

function setFontSettings() {
    if (!settings) return;

    var fontType = settings[widgetId + "_fontType"];
    var fontSize = settings[widgetId + "_fontSize"];
    var fontLineSpacing = settings[widgetId + "_fontLineSpacing"];
    var fontLetterSpacing = settings[widgetId + "_fontLetterSpacing"];
    var rtlEnabled = settings[widgetId + "_rightToLeft"];

    if (typeof rtlEnabled === 'boolean') {
        $('body').css('direction', rtlEnabled ? 'rtl' : 'initial');
    }

    if (widgetId === "goal") {
        let metric = (new URLSearchParams(location.search)).get('metric');
        fontType = settings[widgetId + metric + "_fontType"];
        fontSize = settings[widgetId + metric + "_fontSize"];
        fontLineSpacing = settings[widgetId + metric + "_fontLineSpacing"];
        fontLetterSpacing = settings[widgetId + metric + "_fontLetterSpacing"];
    }

    if (widgetId === "gcounter") {
        let counterId = (new URLSearchParams(location.search)).get('c');
        fontType = settings[widgetId + counterId + "_fontType"];
        fontSize = settings[widgetId + counterId + "_fontSize"];
        fontLineSpacing = settings[widgetId + counterId + "_fontLineSpacing"];
        fontLetterSpacing = settings[widgetId + counterId + "_fontLetterSpacing"];
    }

    if (widgetId === "lastx") {
        let x = (new URLSearchParams(location.search)).get('x');
        fontType = settings[widgetId + x + "_fontType"];
        fontSize = settings[widgetId + x + "_fontSize"];
        fontLineSpacing = settings[widgetId + x + "_fontLineSpacing"];
        fontLetterSpacing = settings[widgetId + x + "_fontLetterSpacing"];
    }


    if (fontType && fontType !== "default" && lastFontType !== fontType) {
        $(".customFont").remove();
        $("head").append($('<link rel="stylesheet">').attr("class", "customFont").attr("href", "https://fonts.googleapis.com/css2?family=" + fontType.replace(" ", "+") + "&display=swap"));
        lastFontType = fontType;

        $("body").css("font-family", "'" + fontType + "'");
    }

    if (fontType === "default") {
        lastFontType = null;

        $(".customFont").remove();

        $("body").css("font-family", "");
    }

    if (fontSize && fontSize != 50) {
        if (widgetId === "myactions") {
            let percent = 100 + ((fontSize - 50) * 3);
            $("text").css("zoom", percent + "%");
        } else {
            let em = 1 + ((fontSize - 50) * 0.01);
            $("html").css("font-size", em + "em");
        }

    } else {
        $("body").css("zoom", "");
        $("text").css("zoom", "");
        $("html").css("font-size", "");
    }

    if (fontLineSpacing) {
        if (fontLineSpacing != 50) {
            let em = 1 + ((fontLineSpacing - 50) * 0.03);
            $("body").css("line-height", em + "em");
        } else {
            $("body").css("line-height", "");
        }
    }

    if (fontLetterSpacing) {
        if (fontLetterSpacing != 50) {
            let em = 0 + ((fontLetterSpacing - 50) * 0.01);
            $("body").css("letter-spacing", em + "em");
        } else {
            $("body").css("letter-spacing", "");
        }
    }
}

function getUserThumbnailUrlFromUserId(userId) {
    let channelId = new URLSearchParams(location.search).get('cid');
    if (userId && channelId) {
        return "/img/user/" + channelId + "/" + userId;
    } else {
        return "/img/nothumb.webp";
    }
}

$(window).on("load", setFontSettings);
addEventListener('load', () => {
    setFontSettings();
});


try {
    if (location.href.includes('preview=1')) {
        let nativeIoOn = io.on;
        let callbacks = {};

        io.on = function (event, callback) {
            callbacks[event] = callback;
            nativeIoOn.call(io, event, callback);
        }

        io.fakeEmit = function (event, data) {
            if (callbacks[event]) {
                callbacks[event](data);
            }
        }

        window.addEventListener('message', function (e) {
            if (e.data && typeof e.data === 'object' && e.data.type === "framePreviewPing") {
                if (typeof window.preview === 'function') window.preview();
            }
        });

        if (["myactions"].includes(widgetId) && !location.href.includes("onStartPage=1")) {
            window.addEventListener('load', function (e) {
                $('body').append($('<div>').text('Example Data')
                    .css('position', 'absolute')
                    .css('top', '5px')
                    .css('right', '15px')
                    .css('font-size', '20px')
                    .css('font-family', 'Arial')
                    .css('color', '#3f3f3f')
                    .css('font-weight', 'bold'));
            });
        }

    }

} catch (err) {

}

function logUsage() {
    if (document.hidden) return;

    fetch("/api/usage/log", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            channelId,
            featureId: 3,
            featureName: widgetId?.toUpperCase(),
        })
    }).catch(err => {
        console.error("Error logging usage:", err);
    });
}

if (!location.href.includes('preview=1')) {
    setInterval(logUsage, 30 * 60 * 1000);
}
</script>

        }

        #cannon {
            width: 10vw;
            max-width: 100px;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="overlayCanvas"></canvas>
    <div id="cannonContainer">
        <img id="cannon" src="img/cannon.png" alt="Cannon">
    </div>

    <script src="/js/lib/matter.min.js"></script>
    <script>
        // Matter.js modules
        const { Engine, Render, Runner, Bodies, Composite, Body, Events } = Matter;

        // Configuration variables
        window.ballTimeout = 30;
        window.maxBalls = 20;
        window.ballSize = 50;
        window.intensity = 50;
        window.showGiftPictures = true;
        window.showCannon = true;

        // Create engine and world
        const engine = Engine.create();
        const world = engine.world;
        world.gravity.y = 1;

        // Setup renderer
        const canvas = document.getElementById('overlayCanvas');
        const render = Render.create({
            canvas, engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent'
            }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        // World bounds
        let thickness;
        const bounds = [];
        function createBounds() {
            Composite.remove(world, bounds);
            bounds.length = 0;
            thickness = Math.max(50, Math.min(window.innerWidth, window.innerHeight) * 0.1);
            bounds.push(
                Bodies.rectangle(window.innerWidth / 2, -thickness / 2, window.innerWidth, thickness, { isStatic: true }),
                Bodies.rectangle(window.innerWidth / 2, window.innerHeight + thickness / 2, window.innerWidth, thickness, { isStatic: true }),
                Bodies.rectangle(-thickness / 2, window.innerHeight / 2, thickness, window.innerHeight, { isStatic: true }),
                Bodies.rectangle(window.innerWidth + thickness / 2, window.innerHeight / 2, thickness, window.innerHeight, { isStatic: true })
            );
            Composite.add(world, bounds);
        }
        createBounds();

        // Rotate cannon between -45° and +45° smoothly and position it
        const cannonContainer = document.getElementById('cannonContainer');
        const cannonImg = document.getElementById('cannon');

        setInterval(() => {
            cannonContainer.style.opacity = window.showCannon ? 0.8 : 0;
        }, 250);

        function updateCannonPosition() {
            const rect = cannonImg.getBoundingClientRect();
            const cannonHeight = rect.height;
            // Position cannon so half of it is below the screen
            cannonContainer.style.bottom = `-${cannonHeight / 2}px`;
        }

        function rotateCannon() {
            const period = 10000; // 10s full cycle
            const t = performance.now();
            const angle = Math.sin((t / period) * 2 * Math.PI) * (Math.PI / 4);
            cannonContainer.style.transform = `translateX(-50%) rotate(${angle}rad)`;
            requestAnimationFrame(rotateCannon);
        }

        // Initialize cannon position after image loads
        cannonImg.onload = () => {
            updateCannonPosition();
            rotateCannon();
        };
        // Fallback in case image is already loaded
        if (cannonImg.complete) {
            updateCannonPosition();
            rotateCannon();
        }

        // Helper to create circular texture with mirrored gift image
        function createTexture(giftPictureUrl, profilePictureUrl, size) {
            return new Promise(resolve => {
                const off = document.createElement('canvas');
                off.width = off.height = size;
                const ctx = off.getContext('2d');
                ctx.beginPath();
                ctx.arc(size / 2, size / 2, size / 2, 0, 2 * Math.PI);
                ctx.clip();

                const imgProf = new Image();
                imgProf.crossOrigin = 'anonymous';
                imgProf.src = profilePictureUrl;

                if (window.showGiftPictures === false) {
                    // Only profile image if giftPictureUrl is null
                    imgProf.onload = () => {
                        ctx.drawImage(imgProf, 0, 0, size, size);
                        resolve(off.toDataURL());
                    };
                } else {
                    // Both images, with gift image mirrored
                    const imgGift = new Image();
                    imgGift.crossOrigin = 'anonymous';
                    imgGift.src = giftPictureUrl;
                    let loaded = 0;
                    function check() {
                        if (++loaded === 2) {
                            ctx.drawImage(imgProf, 0, 0, size, size); // Unflipped profile image
                            ctx.save();
                            ctx.scale(-1, 1); // Mirror gift image horizontally
                            ctx.drawImage(imgGift, -size, 0, size, size); // Adjust x for flip
                            ctx.restore();
                            resolve(off.toDataURL());
                        }
                    }
                    imgProf.onload = check;
                    imgGift.onload = check;
                }
            });
        }


        // Track active projectiles
        const activeProjectiles = [];

        // Helper to remove a projectile with shrinking animation
        function removeProjectile(projectile, useAnimation = true, reason = 'unknown') {
            if (!activeProjectiles.includes(projectile)) return; // Already removed

            const index = activeProjectiles.indexOf(projectile);
            if (index !== -1) activeProjectiles.splice(index, 1);

            if (!useAnimation) {
                // Immediate removal without animation
                Composite.remove(world, projectile);
                return;
            }

            // Shrinking animation
            let scale = 1;
            const shrinkDuration = 1000; // 1 second shrink animation
            const startTime = performance.now();

            const shrink = () => {
                const elapsed = performance.now() - startTime;
                scale = Math.max(0, 1 - elapsed / shrinkDuration); // Linearly reduce scale to 0
                projectile.render.sprite.xScale = scale;
                projectile.render.sprite.yScale = scale;

                if (scale <= 0) {
                    Composite.remove(world, projectile);
                } else {
                    requestAnimationFrame(shrink);
                }
            };
            requestAnimationFrame(shrink);
        }

        /**
         * Fire a gift cannon shot with correct muzzle positioning.
         */
        async function sendCannon(giftPictureUrl, profilePictureUrl) {
            // Check for overcrowding: remove oldest projectile if resting balls span 80%+ of screen height
            let restingBalls = 0;
            let minY = Infinity;
            let maxY = -Infinity;
            let nonRestingInfo = [];
            for (const projectile of activeProjectiles) {
                const velocity = Math.hypot(projectile.velocity.x, projectile.velocity.y);
                if (velocity < 1.0) { // Increased threshold for resting
                    restingBalls++;
                    minY = Math.min(minY, projectile.position.y);
                    maxY = Math.max(maxY, projectile.position.y);
                } else {
                    nonRestingInfo.push(`y=${projectile.position.y}, vel=${velocity}`);
                }
            }
            const span = maxY - minY;
            const isOvercrowded = (
                (restingBalls >= 5 && span >= 0.8 * window.innerHeight) || // Normal overcrowding: 5+ resting, 80% span
                (restingBalls >= 3 && span >= 0.95 * window.innerHeight) || // Full screen: 3+ resting, 95% span
                (activeProjectiles.length >= 20 && span >= 0.9 * window.innerHeight) // Extreme congestion: 20+ total, 90% span
            );
            if (isOvercrowded) {
                const oldestProjectile = activeProjectiles[0];
                removeProjectile(oldestProjectile, false, 'overcrowding');
            }

            // Enforce maxBalls limit by removing oldest projectiles immediately
            while (activeProjectiles.length >= window.maxBalls) {
                const oldestProjectile = activeProjectiles[0];
                removeProjectile(oldestProjectile, false, 'maxBalls');
            }

            // Calculate projectile size and speed based on window size
            const minDimension = Math.min(window.innerWidth, window.innerHeight);
            const referenceSize = 1080; // Reference resolution for scaling
            const speedScale = 0.7 + 0.3 * (minDimension / referenceSize); // Moderate speed reduction
            const radiusFactor = 0.03 + 0.02 * Math.sqrt(referenceSize / minDimension); // Moderate increase at small sizes
            const baseRadius = Math.min(50, Math.max(16, minDimension * radiusFactor)); // Base radius
            // Apply window.ballSize (0 to 100, 50 is default)
            const clampedBallSize = Math.min(100, Math.max(0, window.ballSize || 50)); // Clamp to [0, 100], default to 50
            const sizeMultiplier = clampedBallSize / 50; // 0 → 0, 50 → 1, 100 → 2
            const projRadius = Math.min(100, Math.max(16, baseRadius * sizeMultiplier)); // Adjusted radius, capped at 100px
            const textureSize = Math.round(projRadius * 2);
            const texture = await createTexture(giftPictureUrl, profilePictureUrl, textureSize);

            // Compute current angle and muzzle position
            const t = performance.now();
            const angle = Math.sin((t / 10000) * 2 * Math.PI) * (Math.PI / 4);
            const rect = cannonImg.getBoundingClientRect();
            const length = rect.height - 50; // Full image height as barrel length
            const pivotX = rect.left + rect.width / 2;
            const pivotY = rect.bottom - length * 0.4; // Pivot 40% up the barrel
            const muzzleX = pivotX + Math.sin(angle) * length;
            const muzzleY = pivotY - Math.cos(angle) * length;

            // Create projectile
            const projectile = Bodies.circle(muzzleX, muzzleY - 20, projRadius, {
                restitution: 0.9,
                friction: 0.1,
                render: { sprite: { texture, xScale: 1, yScale: 1 } }
            });
            Composite.add(world, projectile);
            activeProjectiles.push(projectile);

            // Calculate speed for target height, ensuring proportional power
            const frac = 0.6 + Math.random() * 0.3; // Target 60-90% of screen height
            const peakY = window.innerHeight * (1 - frac);
            const h = muzzleY - peakY;
            const vy = Math.sqrt(2 * world.gravity.y * h); // Vertical velocity to reach peakY
            let speed = vy / Math.abs(Math.cos(angle)); // Total speed based on angle
            speed *= speedScale; // Apply moderate speed reduction for small screens
            // Apply window.intensity (1 to 100, 50 is default)
            const clampedIntensity = Math.min(100, Math.max(1, window.intensity || 50)); // Clamp to [1, 100], default to 50
            const intensityMultiplier = clampedIntensity / 50; // 1 → 0.02, 50 → 1, 100 → 2
            speed *= intensityMultiplier; // Adjust speed based on intensity
            Body.setVelocity(projectile, { x: Math.sin(angle) * speed, y: -Math.cos(angle) * speed });

            // Set timeout to remove projectile after window.ballTimeout
            setTimeout(() => {
                removeProjectile(projectile, true, 'ballTimeout');
            }, window.ballTimeout * 1000);
        }
        window.sendCannon = sendCannon;

        // Handle resize
        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            render.options.width = window.innerWidth;
            render.options.height = window.innerHeight;
            createBounds();
            updateCannonPosition();
        });
    </script>

    <script>
        $(window).on("load", () => {

            async function handleOnGift(giftData) {
                if (!giftData.isTest && !(settings && settings.isPro) && !location.href.includes('preview=1')) {
                    return;
                }

                if (giftData.giftType > 1 || giftData.isTest) {
                    sendCannon(giftData.giftPictureUrl, giftData.profilePictureUrl);
                    return;
                }

                let giftKey = `${giftData.userId}_${giftData.giftId}`;

                if (!giftStreaks[giftKey] || giftStreaks[giftKey] > giftData.repeatCount) {
                    giftStreaks[giftKey] = 0;
                }

                let difference = giftData.repeatCount - giftStreaks[giftKey];

                if (difference > 0) {
                    giftStreaks[giftKey] = giftData.repeatCount;
                    while (difference > 0) {
                        difference--;
                        await new Promise(resolve => setTimeout(resolve, 200));
                        sendCannon(giftData.giftPictureUrl, giftData.profilePictureUrl);
                    }
                }

                if (giftData.repeatEnd) {
                    delete giftStreaks[giftKey];
                }
            }

            io.on("gift", handleOnGift);
            io.on("giftCanonTest", handleOnGift);
