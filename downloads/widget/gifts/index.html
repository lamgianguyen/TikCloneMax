<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="/js/guard/obf/trc.js"></script>

    <script src="/js/lib/jquery.min.js" crossorigin="anonymous"></script>
    <script src="/js/lib/socket.io.min.js" crossorigin="anonymous"></script>

    <script src="sharedio/sharedio.js"></script>
    <script src="socketioclient.js?v=10"></script>

    <link rel="stylesheet" href="/css/text-effects.css">
    <script src="/js/text-effects.js"></script>
    <script src="/js/text-effects-labels.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            overflow-x: hidden;
        }

        #chatContainer {
            width: 100%;
            height: calc(100vh - 25px);
            overflow-y: hidden;
            overflow-wrap: break-word;
            word-break: break-all;
            overflow-x: hidden;
        }

        @keyframes chatMessageOpacityIntro {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes chatMessageSlideIntro {
            0% {
                left: 100px;
            }

            100% {
                left: 0px;
            }
        }

        .chatMessage {
            position: relative;
            margin-top: 4px;
            overflow-wrap: break-word;
            word-break: break-all;
            max-width: 100%;
            width: 100%;
            overflow: hidden;
            padding-top: 3px;
            padding-left: 4px;
            padding-right: 10px;
            border-radius: 10px;
        }

        .comment {
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .username {
            font-weight: bold;
            margin-bottom: 2px;
        }

        .profileImage {
            margin-right: 5px;
            border-radius: 15%;
            height: 50px;
            width: 50px;
        }

        .giftImage {
            height: 50px;
            width: 50px;
        }

        td {
            vertical-align: top;
        }

        .giftRight {
            position: absolute;
            right: 20px;
            margin-top: -4px;
        }

        .repeatCount {
            margin-right: 5px;
        }

        .fadeOut {
            animation-name: smoothFadeout;
            animation-duration: 1s;
            animation-fill-mode: forwards;
        }

        @keyframes smoothFadeout {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        @keyframes redBlinkAnimation {
            0% {
                background-color: transparent;
            }

            25% {
                background-color: rgba(211, 65, 60, 0.56);
            }

            50% {
                background-color: rgba(211, 65, 60, 0.56);
            }

            100% {
                background-color: transparent;
            }
        }

        @keyframes redGlowAnimation {
            0% {
                background-color: transparent;
            }

            10% {
                background-color: rgba(211, 65, 60, 0.56);
            }

            100% {
                background-color: transparent;
            }
        }

        .slideIn {
            animation-name: chatMessageOpacityIntro, chatMessageSlideIntro;
            animation-duration: 0.5s, 0.5s;
            animation-iteration-count: 1, 1;
        }

        @keyframes foundAnimation {
            0% {
                background-color: transparent;
            }

            25% {
                background-color: rgba(70, 203, 52, 0.56);
            }

            50% {
                background-color: rgba(70, 203, 52, 0.56);
            }

            100% {
                background-color: transparent;
            }
        }

        @keyframes foundAnimationEnd {
            0% {
                background-color: transparent;
            }

            100% {
                background-color: rgba(70, 203, 52, 0.56);
            }
        }

        .found {
            animation-name: foundAnimation, foundAnimationEnd, chatMessageOpacityIntro, chatMessageSlideIntro;
            animation-duration: 0.5s, 0.3s, 0.5s, 0.5s;
            animation-iteration-count: 3, 1, 1, 1;
            animation-delay: 0s, 1.5s, 0s, 0s;
            animation-fill-mode: none, forwards, none, none;
        }

        @keyframes repeatRefreshAnimation {
            0% {
                transform: scale(1.5, 1.5);
            }

            100% {
                transform: scale(1.0, 1.0);
            }
        }

        .repeatRefresh {
            animation-name: repeatRefreshAnimation;
            animation-duration: 0.5s;
            animation-fill-mode: backwards;
        }
    </style>

    <script>

        var nothumb = "/img/nothumb.webp";

        function rndColorPart(min, max) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        $(window).on("load", () => {

            var chatContainer = $("#chatContainer");
            var template = $(".chatMessage").first().clone();
            template.css("display", "block");

            var userIdColorMappings = {};

            $(".chatMessage").remove();

            io.on("gift", (giftInfo) => {
                //clear
                if ($(".chatMessage").length > 100) {
                    $(".chatMessage").slice(0, 50).remove();
                }

                let giftValue = giftInfo.repeatCount > 0 ? (giftInfo.diamondCount * giftInfo.repeatCount) : giftInfo.diamondCount;

                if (settings.gifts_minValue && giftValue < settings.gifts_minValue) {
                    return;
                }

                var thisItem = template.clone();
                var isNewItem = true;
                var streakKey = `streak_${giftInfo.userId}_${giftInfo.giftType}_${giftInfo.giftId}`;

                if (giftInfo.giftType === 1) {
                    let existingStreaks = $(`.${streakKey}`);
                    if (existingStreaks.length > 0) {
                        thisItem = existingStreaks.last();
                        isNewItem = false;
                    } else {
                        thisItem.addClass(streakKey);
                    }

                    if (giftInfo.repeatEnd) {
                        thisItem.removeClass(streakKey);
                    }
                }

                thisItem.find(".profileImage").attr("src", giftInfo.profilePictureUrl || nothumb)
                thisItem.find(".giftImage").attr("src", giftInfo.giftPictureUrl)
                thisItem.find(".username").text(giftInfo.nickname || giftInfo.uniqueId);
                thisItem.find(".comment").text(giftInfo.describe);
                thisItem.attr("data-ts", new Date().getTime());

                thisItem.find(".comment").css('color', settings.gifts_commentColor);
                thisItem.find(".giftRight").css('color', settings.gifts_commentColor);
                thisItem.css('background-color', settings.gifts_backgroundColor);

                if (giftInfo.repeatCount > 1) {
                    let repeatText = giftInfo.repeatCount + " x";

                    if (thisItem.find('.repeatCount b').text() !== repeatText) {
                        thisItem.find('.repeatCount').removeClass("repeatRefresh");
                        setTimeout(() => {
                            thisItem.find('.repeatCount b').text(repeatText);
                            thisItem.find('.repeatCount').addClass("repeatRefresh");
                        }, 100)
                    }
                }

                if (settings.gifts_showPictures === false) {
                    thisItem.find(".profileImage").css('display', 'none');
                }

                if (settings.gifts_mini) {
                    thisItem.find("img").css('height', "25px");
                    thisItem.find("img").css('width', "25px");
                    thisItem.find("img").css('margin-bottom', "-5px");
                    thisItem.find(".username").text(thisItem.find(".username").text() + ":")
                    thisItem.find(".username").css("display", "inline");
                    thisItem.find(".comment").css("display", "inline");
                    thisItem.css("padding-bottom", "5px");
                } else {
                    thisItem.find(".repeatCount").css("font-size", "1.5em").css("margin-bottom", "4px");
                    thisItem.find(".repeatCount").css("-webkit-text-stroke", "#393939");
                }

                if (settings.gifts_usernameRgb) {
                    if (!userIdColorMappings[giftInfo.userId]) {
                        userIdColorMappings[giftInfo.userId] = "rgba(" + rndColorPart(100, 240) + "," + rndColorPart(100, 240) + "," + rndColorPart(100, 240) + ", 1)";
                    }
                }

                if (window.TextEffects) {
                    const $username = thisItem.find(".username");
                    TextEffects.applyComprehensiveEffects($username, {
                        effect: settings.gifts_usernameEffect || 'none',
                        wave: settings.gifts_usernameWave === 'true' || settings.gifts_usernameWave === true,
                        waveSpeed: settings.gifts_usernameWaveSpeed || 'normal',
                        glow: settings.gifts_usernameGlow === 'true' || settings.gifts_usernameGlow === true,
                        glowColor: settings.gifts_usernameGlowColor || '#ffffff',
                        isRgbColor: settings.gifts_usernameRgb,
                        rgbColor: userIdColorMappings[giftInfo.userId],
                        defaultColor: settings.gifts_usernameColor
                    });
                }

                if (settings.gifts_slideEffect !== false) {
                    thisItem.addClass('slideIn');
                }

                if (isNewItem) {
                    chatContainer.append(thisItem);
                    chatContainer.stop().animate({ scrollTop: chatContainer.prop("scrollHeight") }, 600);
                }

            })
        });

        setInterval(() => {
            if (settings && settings.gifts_hideAfter && settings.gifts_hideAfter > 0) {
                $(".chatMessage").each((i, elem) => {
                    let elemTs = elem.getAttribute("data-ts");
                    if (elemTs) {
                        if (elemTs < (new Date().getTime() - (settings.gifts_hideAfter * 1000))) {
                            $(elem).removeAttr("data-ts").removeClass("slideIn").addClass("fadeOut");
                        }
                    }
                })
            }
        }, 100)

        let previewIndex = 0;
        let previewEnabled = true;

        function preview() {
            if (!previewEnabled) return;
            previewIndex += 1;

            if (previewIndex === 2) {
                io.fakeEmit("gift", {
                    uniqueId: 'Zerody',
                    profilePictureUrl: "https://p16-useast2a.tiktokcdn.com/tos-useast2a-avt-0068-giso/4ec174248f94de26938f73874962469b~c5_100x100.jpeg",
                    giftId: 5655,
                    repeatCount: 1,
                    repeatEnd: false,
                    describe: 'Sent Rose',
                    giftType: 1,
                    giftPictureUrl: 'https://p19-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.png',
                    diamondCount: 1,
                    isTest: true
                })
            }

            if (previewIndex === 4) {
                io.fakeEmit("gift", {
                    uniqueId: 'Zerody',
                    profilePictureUrl: "https://p16-useast2a.tiktokcdn.com/tos-useast2a-avt-0068-giso/4ec174248f94de26938f73874962469b~c5_100x100.jpeg",
                    giftId: 5655,
                    repeatCount: 2,
                    repeatEnd: false,
                    describe: 'Sent Rose',
                    giftType: 1,
                    giftPictureUrl: 'https://p19-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.png',
                    diamondCount: 1,
                    isTest: true
                })
            }

            if (previewIndex === 6) {
                io.fakeEmit("gift", {
                    uniqueId: 'Zerody',
                    profilePictureUrl: "https://p16-useast2a.tiktokcdn.com/tos-useast2a-avt-0068-giso/4ec174248f94de26938f73874962469b~c5_100x100.jpeg",
                    giftId: 5655,
                    repeatCount: 3,
                    repeatEnd: true,
                    describe: 'Sent Rose',
                    giftType: 1,
                    giftPictureUrl: 'https://p19-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.png',
                    diamondCount: 1,
                    isTest: true
                })
            }

            if (previewIndex === 10) {
                io.fakeEmit("gift", {
                    uniqueId: 'Testuser123',
                    profilePictureUrl: "https://p16-va.tiktokcdn.com/tos-maliva-avt-0068/b81edb6ef16b7d3e2e65b08af3be61e0~tplv-tiktok-shrink:72:72.webp",
                    giftId: 5655,
                    repeatCount: 1,
                    repeatEnd: false,
                    describe: 'Sent Doughnut',
                    giftType: 2,
                    giftPictureUrl: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4e7ad6bdf0a1d860c538f38026d4e812~tplv-obj.webp',
                    diamondCount: 30,
                    isTest: true
                })
            }

            if (previewIndex === 15) {
                io.fakeEmit("gift", {
                    uniqueId: 'Testuser123',
                    profilePictureUrl: "https://p16-va.tiktokcdn.com/tos-maliva-avt-0068/b81edb6ef16b7d3e2e65b08af3be61e0~tplv-tiktok-shrink:72:72.webp",
                    giftId: 5655,
                    repeatCount: 1,
                    repeatEnd: false,
                    describe: 'Sent Finger Heart',
                    giftType: 2,
                    giftPictureUrl: 'https://p19-webcast.tiktokcdn.com/img/maliva/webcast-va/a4c4dc437fd3a6632aba149769491f49.png~tplv-obj.png',
                    diamondCount: 1,
                    isTest: true
                })
            }

            if (previewIndex === 17) {
                io.fakeEmit("gift", {
                    uniqueId: 'Testuser123',
                    profilePictureUrl: "https://p77-va.tiktokcdn.com/musically-maliva-obj/1666074441196550~c5_100x100.webp",
                    giftId: 5655,
                    repeatCount: 1,
                    repeatEnd: false,
                    describe: 'Sent GG',
                    giftType: 2,
                    giftPictureUrl: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/3f02fa9594bd1495ff4e8aa5ae265eef~tplv-obj.webp',
                    diamondCount: 1,
                    isTest: true
                })
            }

            if(previewIndex === 20) {
                previewIndex = 0;
            }

        }
    </script>
</head>

<body>
    <div id="chatContainer">
        <div class="chatMessage" style="display: none;">
            <table>
                <tr>
                    <td>
                        <img class="profileImage" onerror="this.src=nothumb" />
                    </td>
                    <td>
                        <div class="username"></div>
                        <div class="comment"></div>
                    </td>
                    <td>
                        <div class="giftRight" style="display:table-row">
                            <div style="display:table-cell; vertical-align: middle;">
                                <div class="repeatCount">
                                    <b></b>
                                </div>
                            </div>
                            <div style="display:table-cell; vertical-align: middle;">
                                <img class="giftImage">
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>

</html>
