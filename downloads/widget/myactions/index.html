        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            font-size: 1.3em;
            width: 100%;
            height: 100%;
            overflow: hidden;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        @keyframes fadeInAnimation {
            from {
                opacity: 0;
                transform: scale(0.1);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeOutAnimation {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .fadeIn {
            animation-name: fadeInAnimation;
            animation-duration: 1s;
            animation-fill-mode: forwards;
        }

        .fadeIn_fast {
            animation-name: fadeInAnimation;
            animation-duration: 0.2s;
            animation-fill-mode: forwards;
        }

        .fadeIn_disabled {
            animation-name: fadeInAnimation;
            animation-duration: 0.01s;
            animation-fill-mode: forwards;
        }

        .fadeOut {
            animation-name: fadeOutAnimation;
            animation-duration: 2s;
            animation-fill-mode: forwards;
        }

        .fadeOut_fast {
            animation-name: fadeOutAnimation;
            animation-duration: 0.5s;
            animation-fill-mode: forwards;
        }

        .fadeOut_disabled {
            animation-name: fadeOutAnimation;
            animation-duration: 0.01s;
            animation-fill-mode: forwards;
        }

        text {
            font-weight: bold;
            font-size: 1.1em;

            -webkit-font-smoothing: antialiased;
            justify-content: center;
            align-items: center;
        }

        text span:not(.wave-char):not(.rainbow-char):not(.rainbow-wave-char):not(.glow-char) {
            position: relative;
            top: 5px;
            animation: bounce .5s ease infinite alternate;
            font-size: 1.5em;
            text-shadow: 0 1px 0 #6e6e6e,
                0 2px 0 rgb(199, 199, 199),
                0 3px 0 rgb(199, 199, 199),
                0 4px 0 rgb(199, 199, 199),
                0 5px 0 rgb(199, 199, 199),
                0 6px 0 transparent,
                0 7px 0 transparent,
                0 8px 0 transparent,
                0 9px 0 transparent,
                0 10px 10px rgba(0, 0, 0, 0.4);
        }

        .username.text-effect--wavy,
        .username.text-effect--wavy-slow,
        .username.text-effect--wavy-fast {
            white-space: normal;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            padding-top: 10px;
            padding-bottom: 10px;
            line-height: 1.4;
        }

        .username .wave-char {
            line-height: inherit;
        }

        .username.text-effect--rainbow,
        .username.text-effect--rainbow span,
        .username.text-effect--rainbow .rainbow-char,
        .username.text-effect--rainbow .rainbow-wave-char {
            text-shadow: none !important;
            animation: none !important;
            position: relative !important;
            top: 0 !important;
        }

        .username.text-effect--rainbow .rainbow-char,
        .username.text-effect--rainbow .rainbow-wave-char {
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
        }

        .username.text-effect--rainbow .rainbow-char {
            animation: rainbow-flow 3s linear infinite !important;
        }

        .username.text-effect--rainbow .rainbow-wave-char {
            animation: rainbow-flow-staggered 4s linear infinite, wave-motion 2s ease-in-out infinite !important;
            animation-delay: calc(var(--char-delay, 0s) * 0.5), var(--char-delay, 0s) !important;
        }

        .username.text-effect--rainbow.text-effect--wavy .rainbow-wave-char,
        .username.text-effect--rainbow.text-effect--wavy-slow .rainbow-wave-char,
        .username.text-effect--rainbow.text-effect--wavy-fast .rainbow-wave-char {
            animation: rainbow-flow-staggered 4s linear infinite, wave-motion 2s ease-in-out infinite !important;
            animation-delay: calc(var(--char-delay, 0s) * 0.5), var(--char-delay, 0s) !important;
        }

        .username.text-effect--aurora,
        .username.text-effect--aurora span,
        .username.text-effect--aurora .wave-char {
            text-shadow: none !important;
            position: relative !important;
            top: 0 !important;
        }

        .username.text-effect--aurora .wave-char {
            background: inherit !important;
            background-clip: text !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
        }

        .wave-char,
        .rainbow-char,
        .rainbow-wave-char,
        .glow-char {
            animation: unset !important;
            text-shadow: none !important;
            top: 0 !important;
            position: relative !important;
        }

        .text-effect--wavy .wave-char,
        .text-effect--wavy-slow .wave-char,
        .text-effect--wavy-fast .wave-char {
            animation: wave-motion 2s ease-in-out infinite !important;
            animation-delay: var(--char-delay, 0s) !important;
        }

        @keyframes bounce {

            animation-duration: 0.5s;

        var actionItems = [];
        var actionIdQueue = [];
        var currentAction = null;

        function updateItems() {
            $.get("/api/rest/action?channelId=" + channelId + "&screenId=" + screenId + "&profileId=current&pageSize=1000", (resp) => {
                actionItems.forEach(actionItem => {
                    actionItem.destroy();
                })

                actionItems = [];

                resp.actions.forEach(actionInfo => {
                    actionItems.push(new ActionItem(actionInfo));
                });
            })
        }

        function buildAndReportStateObject() {
            var stateObj = {};

            stateObj.event = 'reportScreenState';
            stateObj.currentActionId = currentAction && currentAction.playing ? currentAction.id : null;
            stateObj.currentActionName = currentAction && currentAction.playing ? currentAction.name : null;
            stateObj.currentQueueSize = actionIdQueue.length;

            if (lastStateObj && lastStateObj === JSON.stringify(stateObj)) return;
            lastStateObj = JSON.stringify(stateObj);

            reportState(stateObj);
        }

        function processQueue() {
            if (actionIdQueue.length === 0) return;

            if (currentAction && currentAction.fadeoutInProgress) {
                return;
            }

            if (currentAction && currentAction.playing) {
                if (currentAction.dynamicConfig.skipOnNext) {
                    currentAction.scheduleFadeout();
                }
                return;
            }

            var actionInfoToPlay = actionIdQueue.shift();
            var actionIdToPlay = actionInfoToPlay.actionId;
            var actionToPlay = actionItems.find(x => x.id === actionIdToPlay);

            if (!actionToPlay) return;

            currentAction = actionToPlay;
            currentAction.traceStartTs = Date.now();

            try {
                actionToPlay.start(actionInfoToPlay.context);
            } catch (err) {
                window.lastError = err;
                throw err;
            }

            buildAndReportStateObject();
        }

        setInterval(() => {
            if (currentAction && (currentAction.playing || currentAction.fadeoutInProgress)) {
                if (currentAction.traceStartTs && Date.now() - currentAction.traceStartTs > 60000) {
                    let logObj = {
                        runningSinceMinutes: Math.floor((Date.now() - currentAction.traceStartTs) / 60000),
                        playing: currentAction.playing,
                        fadeoutInProgress: currentAction.fadeoutInProgress,
                        actionId: currentAction.id,
                        duration: currentAction.duration,
                    }

                    logError({ type: "ActionPlayTimeout", message: "Timeout", logObj });
                }
            }
        }, 1000 * 60 * 1);


        $(window).on("load", () => {

            if (channelId > 0) {
                updateItems();

                io.on("actionsChanged", () => {

                });

                    previewEnabled = false;
                    if (actionInfo.screenId !== screenId) return;
                    if (actionIdQueue.length > 1000) return;

                    var hasMediaOnScreen = actionInfo.imageUrl || actionInfo.audioUrl || actionInfo.videoUrl || actionInfo.animationUrl || actionInfo.text || actionInfo.textToSpeech;

                    if (actionInfo.text && context.thumbnailUrl && preloadImageQueue.length < 30) {
                        preloadImageQueue.push(context.thumbnailUrl);
                    }

                    actionIdQueue.push({ actionId: actionInfo.id, context });
                    processQueue();
                });

                io.on("controlpageConnected", () => {
                    lastStateObj = null;
                })

                setInterval(processQueue, 100);

                setInterval(buildAndReportStateObject, 2000);

                setInterval(() => {
                    lastStateObj = null;
                }, 20000)
