<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="/js/guard/obf/trc.js"></script>

    <script src="/js/lib/jquery.min.js" crossorigin="anonymous"></script>
    <script src="/js/lib/socket.io.min.js" crossorigin="anonymous"></script>

    <script src="sharedio/sharedio.js"></script>
    <script src="socketioclient.js?v=10"></script>

    <style>
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 999999;
        }
    </style>
</head>

<body>
    <iframe></iframe>

    <script>
        let params = new URLSearchParams(window.location.search);
        let dockId = params.get('did');
        let iframe = document.querySelector("iframe");

        iframe.addEventListener("load", () => {
            if (window.location.href.includes("preview=1")) {
                iframe.contentDocument.body.style.backgroundColor = "transparent";
            }
        });

        iframe.src = `./vite/src/activity-feed/?dockId=${dockId}&cid=${params.get('cid')}`;

        io.on("dockData", (event) => {
            if (!window.location.href.includes("preview=1")) {
                iframe.contentWindow.postMessage(event, "*");
            }
        });

        window.addEventListener("message", (event) => {
            if (event.data && typeof event.data === "object" && event.data.type && event.data.payload) {
                iframe.contentWindow.postMessage(event.data, "*");
            }
        });
    </script>
</body>

</html>
