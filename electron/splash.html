<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>TikFinity</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #212121;
    background-image:
      radial-gradient(circle at 30% 20%, rgba(255, 0, 80, 0.15) 0%, transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(0, 242, 234, 0.10) 0%, transparent 45%),
      linear-gradient(160deg, #1a1a1a 0%, #212121 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-app-region: drag;
  }
  .wrap {
    text-align: center;
    padding: 0 32px;
    width: 100%;
  }
  .logo {
    width: 96px;
    height: 96px;
    margin: 0 auto 16px;
    display: block;
    filter: drop-shadow(0 6px 24px rgba(255, 0, 80, 0.35));
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #ff0050, #00f2ea);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 11px;
    color: #9aa0a6;
    margin-top: 4px;
    margin-bottom: 18px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.12);
    border-top-color: #ff0050;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    margin-top: 10px;
    font-size: 12px;
    color: #c4c7c5;
    min-height: 16px;
    letter-spacing: 0.2px;
    opacity: 0;
    transition: opacity 300ms ease-out;
  }
  .status.show {
    opacity: 1;
  }
  .progress-bar {
    margin: 16px auto 0;
    width: 240px;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 300ms ease-out;
  }
  .progress-bar.show {
    opacity: 1;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff0050, #00f2ea);
    width: 0%;
    transition: width 300ms ease-out;
  }
  .version {
    position: absolute;
    bottom: 10px;
    right: 14px;
    font-size: 10px;
    color: #5f6368;
    letter-spacing: 0.6px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="splash-logo.png" alt="TikFinity" draggable="false">
    <div class="title">TikFinity</div>
    <div class="subtitle">Local Stream Studio</div>
    <div><span class="spinner"></span></div>
    <div id="status" class="status">Đang khởi động...</div>
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <div id="progress-text" class="status" style="margin-top: 8px; font-size: 11px;">0/10</div>
  </div>
  <div class="version" id="version"></div>
  <script>
    function updateProgress(step) {
      const pct = Math.min(95, (step / 10) * 100);
      const progressBar = document.querySelector('.progress-bar');
      const progressText = document.getElementById('progress-text');
      const statusEl = document.getElementById('status');

      if (step === 1) {
        progressBar.classList.add('show');
        statusEl.classList.add('show');
      }

      document.getElementById('progress-fill').style.width = pct + '%';
      progressText.textContent = step + '/10';
    }
    if (window.SPLASH) {
      window.SPLASH.onStatus(function (text) {
        document.getElementById('status').textContent = text || '';
      });
      window.SPLASH.onVersion(function (v) {
        document.getElementById('version').textContent = v ? 'v' + v : '';
      });
      window.SPLASH.onProgress(function (step) {
        updateProgress(step);
      });
    }
  </script>
</body>
</html>
